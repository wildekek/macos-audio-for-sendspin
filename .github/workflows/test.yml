# Unit tests on every push and pull request. Tests that need the installed driver are
# Tests/device-tests.sh, run on a Mac before a release.
name: Test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Swift package tests
        run: swift test --package-path Packages/SendspinServerKit

      - uses: astral-sh/setup-uv@v10.2.0

      - name: The Mac as a source, against scripted servers
        run: |
          swift build --package-path Packages/SendspinServerKit --product sendspin-bridge
          uv run Tests/interop/test_server.py --bridge Packages/SendspinServerKit/.build/debug/sendspin-bridge

      - name: The server side, against scripted players
        run: uv run Tests/interop/test_client.py --bridge Packages/SendspinServerKit/.build/debug/sendspin-bridge

      # The reference player, on the library ESPHome speakers run; pinned, and checked.
      - name: The server side, against sendspin-cpp-cli
        env:
          VERSION: 0.4.0
          SHA256: f18a1c3dc80193c1475fead90a0e7f82e3ae00103a0544e2d3a6b6914366c48e
        run: |
          tarball="$RUNNER_TEMP/sendspin-cli.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/Sendspin/sendspin-cpp-cli/releases/download/v$VERSION/sendspin-cli-$VERSION-macos-arm64.tar.gz"
          echo "$SHA256  $tarball" | shasum -a 256 -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          uv run Tests/interop/test_cpp.py --bridge Packages/SendspinServerKit/.build/debug/sendspin-bridge \
            --sendspin-cli "$RUNNER_TEMP/sendspin-cli-$VERSION-macos-arm64/usr/local/bin/sendspin-cli"

      - name: Driver ring buffer test
        run: |
          cmake -S Driver -B Driver/build
          cmake --build Driver/build
          Driver/tests/run_ring_test.sh
