name: MacOSAudioForSendspin
options:
  bundleIdPrefix: eu.vooijs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SendspinServerKit:
    path: ../Packages/SendspinServerKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.6.1"
    CURRENT_PROJECT_VERSION: "11"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  MacOSAudioForSendspin:
    type: application
    platform: macOS
    sources:
      - path: MacOSAudioForSendspin
    dependencies:
      - package: SendspinServerKit
        product: SendspinServerKit
      - package: SendspinServerKit
        product: SendspinAudio
    # The app carries the audio driver and installs it itself (see DriverInstaller). This runs
    # before Xcode signs the app, so the app's signature covers the driver too.
    postBuildScripts:
      - name: Embed audio driver
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          identity="${EXPANDED_CODE_SIGN_IDENTITY:-}"
          build="${DERIVED_FILE_DIR}/driver"
          # Quiet unless it fails: progress on stderr shows as a "failed" step in quiet builds.
          if ! { cmake -S "${SRCROOT}/../Driver" -B "$build" -DCODESIGN_ID="${identity:--}" \
                 && cmake --build "$build"; } > "${DERIVED_FILE_DIR}/driver-build.log" 2>&1; then
            cat "${DERIVED_FILE_DIR}/driver-build.log"
            exit 1
          fi
          destination="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/Audio/Plug-Ins/HAL"
          mkdir -p "$destination"
          rm -rf "$destination/MacOSAudioForSendspin.driver"
          ditto "$build/MacOSAudioForSendspin.driver" "$destination/MacOSAudioForSendspin.driver"
    info:
      path: MacOSAudioForSendspin/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: Licensed under the Apache License, Version 2.0
        NSLocalNetworkUsageDescription: >-
          macOS Audio for Sendspin finds Sendspin speakers on your network and streams audio to them.
        NSBonjourServices:
          - _sendspin._tcp
          - _sendspin-server._tcp
          - _mass._tcp
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: macOS Audio for Sendspin
        PRODUCT_MODULE_NAME: MacOSAudioForSendspin
        PRODUCT_BUNDLE_IDENTIFIER: eu.vooijs.MacOSAudioForSendspin
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon  # make-app-icon.swift draws it
        # The identity comes from Signing.xcconfig: ad-hoc unless Local.xcconfig says otherwise.
        CODE_SIGN_STYLE: Manual
        SWIFT_STRICT_CONCURRENCY: complete
        # The driver script builds ../Driver with CMake, outside the sandboxed inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Dev builds are a separate app: own settings, permissions and privacy entries,
        # so they don't mix with an installed release. They share the one driver.
        Debug:
          PRODUCT_NAME: macOS Audio for Sendspin (Dev)
          PRODUCT_BUNDLE_IDENTIFIER: eu.vooijs.MacOSAudioForSendspin.dev
