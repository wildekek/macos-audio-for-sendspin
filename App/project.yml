name: MacOSAudioForSendspin
options:
  bundleIdPrefix: eu.vooijs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SendspinServerKit:
    path: ../Packages/SendspinServerKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  MacOSAudioForSendspin:
    type: application
    platform: macOS
    sources:
      - path: MacOSAudioForSendspin
    dependencies:
      - package: SendspinServerKit
        product: SendspinServerKit
      - package: SendspinServerKit
        product: SendspinAudio
    info:
      path: MacOSAudioForSendspin/Info.plist
      properties:
        CFBundleName: macOS Audio for Sendspin
        CFBundleDisplayName: macOS Audio for Sendspin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: Licensed under the Apache License, Version 2.0
        NSMicrophoneUsageDescription: >-
          macOS Audio for Sendspin captures the audio played to the Sendspin output device,
          to stream it to your speakers.
        NSLocalNetworkUsageDescription: >-
          macOS Audio for Sendspin finds Sendspin speakers on your network and streams audio to them.
        NSBonjourServices:
          - _sendspin._tcp
    entitlements:
      path: MacOSAudioForSendspin/MacOSAudioForSendspin.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: macOS Audio for Sendspin
        PRODUCT_MODULE_NAME: MacOSAudioForSendspin
        PRODUCT_BUNDLE_IDENTIFIER: eu.vooijs.MacOSAudioForSendspin
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc signing for local builds; release builds pass a Developer ID.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: complete
