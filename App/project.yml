name: SendspinForMac
options:
  bundleIdPrefix: eu.vooijs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  SendspinServerKit:
    path: ../Packages/SendspinServerKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  SendspinForMac:
    type: application
    platform: macOS
    sources:
      - path: SendspinForMac
    dependencies:
      - package: SendspinServerKit
        product: SendspinServerKit
      - package: SendspinServerKit
        product: SendspinAudio
    info:
      path: SendspinForMac/Info.plist
      properties:
        CFBundleName: Sendspin for Mac
        CFBundleDisplayName: Sendspin for Mac
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: Licensed under the Apache License, Version 2.0
        NSMicrophoneUsageDescription: >-
          Sendspin for Mac captures the audio played to the Sendspin output device,
          to stream it to your speakers.
        NSLocalNetworkUsageDescription: >-
          Sendspin for Mac finds Sendspin speakers on your network and streams audio to them.
        NSBonjourServices:
          - _sendspin._tcp
    entitlements:
      path: SendspinForMac/SendspinForMac.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Sendspin for Mac
        PRODUCT_MODULE_NAME: SendspinForMac
        PRODUCT_BUNDLE_IDENTIFIER: eu.vooijs.SendspinForMac
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc signing for local builds; release builds pass a Developer ID.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        SWIFT_STRICT_CONCURRENCY: complete
