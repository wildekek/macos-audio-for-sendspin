<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sendspin menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 340px; box-sizing: border-box; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; color: #1d1d1f; background: #f5f5f7; border: 0.5px solid rgba(0, 0, 0, 0.16); border-radius: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16)">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 28px">
    <span style="font-weight: 600">Sendspin</span>
    <button aria-label="Sendspin" aria-pressed="{{ onPressed }}" onClick="{{ toggle }}" style="{{ switchTrack }}">
      <span style="{{ switchKnob }}"></span>
    </button>
  </div>
  <sc-if value="{{ elsewhere }}" hint-placeholder-val="{{ false }}">
    <p style="margin: 0; font-size: 12px; line-height: 16px; color: #6e6e73">Your Mac plays on External Headphones.</p>
  </sc-if>
  <div style="height: 1px; background: rgba(0, 0, 0, 0.1)"></div>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{ speakers }}" as="s" hint-placeholder-count="2">
      <div style="display: flex; align-items: center; gap: 10px; height: 38px">
        <button onClick="{{ s.only }}" style="display: flex; flex: 1 1 auto; min-width: 0; align-items: center; gap: 10px; height: 38px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer">
          <span style="{{ s.iconStyle }}">
            <sc-if value="{{ s.isMac }}" hint-placeholder-val="{{ false }}">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="10" height="7.5" rx="1"></rect><path d="M1 12.5h14"></path></svg>
            </sc-if>
            <sc-if value="{{ s.isSpeaker }}" hint-placeholder-val="{{ true }}">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="1" width="8" height="12" rx="1.5"></rect><circle cx="7" cy="8.5" r="2"></circle><circle cx="7" cy="4" r="0.6"></circle></svg>
            </sc-if>
          </span>
          <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.name }}</span>
        </button>
        <sc-if value="{{ s.playing }}" hint-placeholder-val="{{ true }}">
          <input type="range" min="0" max="100" value="{{ s.volume }}" onChange="{{ s.setVolume }}" aria-label="{{ s.volumeLabel }}" style="width: 90px; margin: 0; accent-color: #6e6e73">
        </sc-if>
        <button aria-label="{{ s.name }}" aria-pressed="{{ s.pressed }}" onClick="{{ s.toggle }}" style="{{ s.boxStyle }}">
          <sc-if value="{{ s.ticked }}" hint-placeholder-val="{{ true }}">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="2.5,6.5 5,9 9.5,3.5"></polyline></svg>
          </sc-if>
        </button>
      </div>
    </sc-for>
    <div style="height: 1px; margin: 4px 0; background: rgba(0, 0, 0, 0.1)"></div>
    <button onClick="{{ chooseMusicAssistant }}" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer">
      <span style="{{ maIcon }}">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.5" y="2" width="11" height="4" rx="1"></rect><rect x="1.5" y="8" width="11" height="4" rx="1"></rect><circle cx="4" cy="4" r="0.6"></circle><circle cx="4" cy="10" r="0.6"></circle></svg>
      </span>
      <span style="{{ maTitle }}">Music Assistant</span>
    </button>
    <sc-if value="{{ maCaption }}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; padding: 0 0 6px 36px; font-size: 11px; line-height: 15px; color: #6e6e73">Choose speakers, groups and volume in Music Assistant.</p>
    </sc-if>
  </div>
  <div style="height: 1px; background: rgba(0, 0, 0, 0.1)"></div>
  <div style="display: flex; align-items: center; justify-content: space-between; height: 22px">
    <button style="padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer">Quit</button>
    <button aria-label="Settings" style="display: flex; padding: 0; border: 0; background: none; color: inherit; cursor: pointer">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.4"></circle><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"on":{"editor":"boolean","default":true},"destination":{"editor":"enum","options":["speakers","musicAssistant"],"default":"speakers"},"macOutput":{"editor":"enum","options":["other","speakers"],"default":"other"},"$preview":{"width":340,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.state.on ?? this.props.on ?? true;
    const destination = this.state.destination ?? this.props.destination ?? 'speakers';
    // Where the Mac plays while Sendspin is off: its own speakers, or another output.
    const macOutput = this.state.macOutput ?? this.props.macOutput ?? 'other';
    const direct = !on && macOutput === 'speakers';
    const ticked = this.state.ticked ?? (direct ? { mac: true, aux: false } : { mac: true, aux: true });
    const volumes = this.state.volumes ?? { mac: 60, aux: 45 };
    const blue = '#0a7aff';
    const icon = (active) => 'display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 13px; flex: none; '
      + (active ? 'background: ' + blue + '; color: #ffffff' : 'background: rgba(0, 0, 0, 0.08); color: #1d1d1f');
    const onSpeakers = on && destination === 'speakers';
    const maChosen = on && destination === 'musicAssistant';
    const list = [
      { id: 'mac', name: 'MacBook Pro Speakers', kind: 'mac' },
      { id: 'aux', name: 'Home Assistant Connect AUX-2', kind: 'speaker' },
    ];
    // Ticking decides the output: a Sendspin speaker needs Sendspin; the Mac's own speakers
    // alone are played directly, without the speaker buffer's delay.
    const apply = (next) => {
      if (next.aux) this.setState({ ticked: next, on: true, destination: 'speakers' });
      else if (next.mac) this.setState({ ticked: next, on: false, macOutput: 'speakers' });
      else this.setState({ ticked: next });
    };
    const speakers = list.map((s) => {
      const isTicked = !!ticked[s.id];
      const playing = isTicked && (onSpeakers || (direct && s.id === 'mac'));
      return {
        ...s,
        isMac: s.kind === 'mac',
        isSpeaker: s.kind === 'speaker',
        ticked: isTicked,
        playing,
        pressed: isTicked ? 'true' : 'false',
        volume: volumes[s.id],
        volumeLabel: s.name + ' volume',
        iconStyle: icon(playing),
        // Clicking the name plays on this one only; the checkbox adds or removes it.
        only: () => apply({ mac: s.id === 'mac', aux: s.id === 'aux' }),
        toggle: () => apply({ ...ticked, [s.id]: !isTicked }),
        setVolume: (event) => this.setState({ volumes: { ...volumes, [s.id]: Number(event.target.value) } }),
        boxStyle: 'display: flex; align-items: center; justify-content: center; flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 5px; cursor: pointer; background: '
          + (isTicked ? 'rgba(60, 60, 67, 0.55)' : 'rgba(60, 60, 67, 0.2)'),
      };
    });
    return {
      on,
      elsewhere: !on && macOutput !== 'speakers',
      onPressed: on ? 'true' : 'false',
      // Off: the Mac goes back to the output it had before Sendspin.
      toggle: () => this.setState(on ? { on: false, macOutput: 'other' } : { on: true }),
      switchTrack: 'position: relative; flex: none; width: 32px; height: 19px; padding: 0; border: 0; border-radius: 10px; cursor: pointer; background: '
        + (on ? blue : 'rgba(60, 60, 67, 0.3)'),
      switchKnob: 'position: absolute; top: 2px; left: ' + (on ? '15px' : '2px')
        + '; width: 15px; height: 15px; border-radius: 8px; background: #ffffff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: left 0.15s',
      speakers,
      maIcon: icon(maChosen),
      maTitle: 'white-space: nowrap; font-weight: ' + (maChosen ? '600' : '400'),
      maCaption: maChosen,
      chooseMusicAssistant: () => this.setState({ on: true, destination: 'musicAssistant' }),
    };
  }
}
</script>
</body>
</html>
