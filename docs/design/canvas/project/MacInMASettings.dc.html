<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: Music Assistant can play here</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 508px; height: 330px; box-sizing: border-box; padding: 24px; background: #e3e6ec; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; color: #1d1d1f">
  <div style="width: 460px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 6px; background: #ececec; border: 0.5px solid rgba(0, 0, 0, 0.16); border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.16)">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; background: #ffffff; border-radius: 8px; border: 0.5px solid rgba(0, 0, 0, 0.08)">
      <span>Open at login</span>
      <button role="switch" aria-checked="true" aria-label="Open at login" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
    </div>
    <div style="height: 10px"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; background: #ffffff; border-radius: 8px; border: 0.5px solid rgba(0, 0, 0, 0.08)">
      <span>Music Assistant can play on this Mac</span>
      <button role="switch" aria-checked="{{ maChecked }}" aria-label="Music Assistant can play on this Mac" onClick="{{ toggle }}" style="{{ maSwitch }}"><span style="{{ maKnob }}"></span></button>
    </div>
    <p style="margin: 0; padding: 0 12px; font-size: 11px; line-height: 15px; color: #5f5f66">{{ footer }}</p>
    <div style="height: 10px"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; background: #ffffff; border-radius: 8px; border: 0.5px solid rgba(0, 0, 0, 0.08)">
      <span>Uninstall</span>
      <button style="padding: 3px 12px; border: 0.5px solid rgba(0, 0, 0, 0.2); border-radius: 6px; background: #ffffff; font: inherit; color: #c4291c; cursor: pointer">Uninstall…</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":508,"height":330}}'>
class Component extends DCLogic {
  renderVals() {
    const on = this.state.on ?? true;
    const track = (isOn) => 'position: relative; flex: none; width: 38px; height: 22px; padding: 0; border: 0; border-radius: 11px; cursor: pointer; background: ' + (isOn ? '#0a7aff' : 'rgba(60, 60, 67, 0.28)');
    const knob = (isOn) => 'position: absolute; top: 2px; left: ' + (isOn ? '18px' : '2px') + '; width: 18px; height: 18px; border-radius: 9px; background: #ffffff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3)';
    return {
      switchOn: track(true),
      knobOn: knob(true),
      maSwitch: track(on),
      maKnob: knob(on),
      maChecked: on ? 'true' : 'false',
      toggle: () => this.setState({ on: !on }),
      footer: on
        ? 'Music Assistant lists this Mac as a speaker. While it plays here, the Mac’s speakers leave your group.'
        : 'Music Assistant can still play the Mac’s sound elsewhere, but not on this Mac.',
    };
  }
}
</script>
</body>
</html>
