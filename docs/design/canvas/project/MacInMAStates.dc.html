<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Mac's row, with Music Assistant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 560px; height: 420px; box-sizing: border-box; padding: 24px; background: #e3e6ec; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; color: #1d1d1f">
  <div style="box-sizing: border-box; padding: 8px 14px; display: flex; flex-direction: column; background: #f5f5f7; border: 0.5px solid rgba(0, 0, 0, 0.16); border-radius: 14px">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 16px; min-height: 70px; border-bottom: 1px solid rgba(0, 0, 0, 0.06)">
        <div style="width: 170px; flex: none; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 600">{{ r.state }}</span>
          <span style="font-size: 11px; line-height: 14px; color: #5f5f66">{{ r.means }}</span>
        </div>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px; height: 38px">
          <span style="display: flex; align-items: center; justify-content: center; flex: none; width: 26px; height: 26px; border-radius: 13px; background: rgba(0, 0, 0, 0.08); color: #1d1d1f">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="10" height="7.5" rx="1"></rect><path d="M1 12.5h14"></path></svg>
          </span>
          <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">MacBook Pro Speakers</span>
          <sc-if value="{{ r.slider }}" hint-placeholder-val="{{ true }}">
            <span role="img" aria-label="MacBook Pro Speakers volume" style="position: relative; flex: none; width: 80px; height: 16px">
              <span style="position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 2px; background: rgba(60, 60, 67, 0.18)"></span>
              <span style="position: absolute; left: 0; width: 55%; top: 6px; height: 4px; border-radius: 2px; background: rgba(60, 60, 67, 0.7)"></span>
              <span style="position: absolute; left: calc(55% - 11px); top: 1px; width: 22px; height: 14px; border-radius: 7px; background: #ffffff; box-shadow: 0 0.5px 2px rgba(0, 0, 0, 0.35)"></span>
            </span>
          </sc-if>
          <sc-if value="{{ r.hasStatus }}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 11px; color: #5f5f66; white-space: nowrap; flex: none">{{ r.status }}</span>
          </sc-if>
          <sc-if value="{{ r.hasCheck }}" hint-placeholder-val="{{ true }}">
            <span style="{{ r.checkStyle }}">
              <sc-if value="{{ r.inGroup }}" hint-placeholder-val="{{ true }}">
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="2.5,6.5 5,9 9.5,3.5"></polyline></svg>
              </sc-if>
            </span>
          </sc-if>
          <sc-if value="{{ r.noCheck }}" hint-placeholder-val="{{ false }}">
            <span style="width: 22px; flex: none"></span>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const blue = '#0a7aff';
    const row = (r) => ({
      hasStatus: !!r.status, slider: !!r.slider, hasCheck: r.check !== 'none', noCheck: r.check === 'none',
      inGroup: r.check === 'in',
      checkStyle: 'display: flex; align-items: center; justify-content: center; flex: none; width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; '
        + (r.check === 'in' ? 'background: ' + blue : 'border: 1.5px solid rgba(60, 60, 67, 0.35)'),
      ...r,
    });
    return {
      rows: [
        { state: 'In your group', means: 'As today: Music Assistant isn’t playing here.', slider: true, check: 'in' },
        { state: 'Music Assistant plays here', means: 'It took the speakers, as it takes a Sendspin speaker. Check it to take them back.', status: 'Music Assistant', check: 'out' },
        { state: 'Direct, Music Assistant too', means: 'Open question. Nothing is captured, so both play, mixed, as two apps do.', status: 'Music Assistant too', check: 'in' },
        { state: 'A server plays the Mac’s sound', means: 'No checks, as today. Music Assistant may still play here.', status: 'Music Assistant', check: 'none' },
        { state: 'Music Assistant unreachable', means: 'Nothing changes: the row only shows it while it plays here.', slider: true, check: 'in' },
      ].map(row),
    };
  }
}
</script>
</body>
</html>
